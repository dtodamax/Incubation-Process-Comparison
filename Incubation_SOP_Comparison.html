ation roadmap defining next milestones, support needs, partnership opportunities, and follow-up activities.", "Within 1 week after notification", "SGA,\nStartup Founders", "Startup founders", ""], ["12", "Complete graduation closure activities including exit documentation, continued-service activation, alumni registration, or PIS transition actions.", "Within 10 working days after cohort close", "IP Manager,\nProgram Staff", "Startup founders", ""], ["13", "Update startup database and finalize cohort graduation records including status, pathway, impact indicators, and historical support data.", "Within 15 working days after cohort close", "SGA, \nDT Team", "", ""], ["14", "Prepare cohort Graduation Impact Report covering startup growth, business outcomes, ecosystem contribution, employment impact, community impact, and program effectiveness.", "Within 20 working days after cohort close", "SGA, \nDT Team", "", ""], ["Add more rows as needed. Each step should be a single, clearly defined action.", "", "", "", "", ""]], [["Gap", "Recommendation"], ["Chưa có cơ chế rõ ràng để duy trì engagement giữa startup alumni và các chương trình của USI sau khi kết thúc Incubation Program, đặc biệt thông qua USI Community.", "Overall: Các process steps hiện tại cơ bản đã có, nhưng cần bổ sung chi tiết hơn về execution và điều chỉnh thứ tự một số bước để phản ánh đầy đủ quá trình graduation/offboarding.\nS3 → đưa lên trước S1.\nAdd-in – Offboarding Session: Bổ sung một buổi offboarding chung, mang tính informal cho toàn bộ startup trong cohort. Buổi này dùng để reflection về quá trình tham gia chương trình và collect feedback trực tiếp từ startup, làm input để cải thiện chương trình và bổ sung cho hoạt động recruitment của cohort tiếp theo.\nS2 – Đo lường tác động của Incubation Program: Xây dựng các criteria để SGA cập nhật, giúp đo lường chương trình đã tạo ra bao nhiêu giá trị cho startup, ví dụ: network mới, mentor mới, chương trình/hoạt động đã engage, giải thưởng, sự phát triển đội ngũ… Ví dụ: Onto từ 4 thành viên phát triển thành đội ngũ lớn hơn, trong đó có sinh viên UEH.\nTrong quá trình đo lường impact, cần ghi nhận kết quả thực tế của các support request, không chỉ ghi nhận việc đã hỗ trợ. Ví dụ: request đặt phòng được sử dụng cho hoạt động gì; hỗ trợ tuyển dụng mang lại kết quả như thế nào.\nS5 – SGA Reflection Meeting: Tổ chức một buổi họp giữa các SGA để tổng hợp cohort vừa kết thúc: cohort đã đạt những milestone nào, Incubation Program đã deliver những giá trị gì cho startup, đã hoàn thành bao nhiêu request, mentoring session và các hoạt động hỗ trợ khác.\nTrong SGA Reflection Meeting, đồng thời review startup đã có những tiến triển gì, mức độ mature, thành tích đạt được, và tổng hợp lessons learned cho cohort tiếp theo.\nCó thể crawl data và xây dựng dashboard trực quan để hỗ trợ việc tổng hợp và theo dõi các kết quả trên.\nAdd-in giữa S5 và S6 – Startup Post-Program Decision: Bổ sung bước để SGA xác định hướng xử lý tiếp theo cho từng startup trong cohort: offboarding, tiếp tục sử dụng dịch vụ, hoặc PIS."]], [["", "Có một buổi meeting giữa các SGA để thống nhất từng startup sau cohort sẽ được xử lý như thế nào. Nếu startup tiếp tục sử dụng dịch vụ thì áp dụng các process đã có phía trên như gặp SGA, Mentoring, Shared Services...\nS6 – Propose Next Step for Each Startup: Sau khi kết thúc Incubation Program, SGA và startup cùng xây dựng OKRs cho 6 tháng tiếp theo, giúp visualize rõ startup cần làm gì và hướng phát triển trong giai đoạn tiếp theo.\nS7 – Impact Report: Báo cáo không chỉ phản ánh kết quả của cohort mà cần thể hiện tác động của Incubation Program đối với xã hội, ví dụ: job creation, tuyển dụng sinh viên, giá trị/doanh thu tạo ra, đóng góp cho cộng đồng và số lượng dự án được hỗ trợ."]], [["#", "Condition / Decision Point", "If YES → Action", "If NO → Action"], ["1", "Has the startup met the graduation criteria?", "Proceed with graduation evaluation.", "Request additional information or complete the remaining evaluat function showOverview(scroll=true){active=null;mode='compare';resetNav();$('screen').innerHTML='<h1 class="overview-h">Tổng quan thay đổi SOP</h1><p class="page-lead">Một nơi để rà soát toàn bộ Incubation Program: xem những thay đổi quan trọng, thống nhất vai trò chung, rồi mở từng SOP để đối chiếu chi tiết.</p><div class="stats">'+stat('12 / 12','SOP đã đưa vào đối chiếu')+stat(D.totalOld+' → '+D.totalNew,'Dòng bước đánh số trong nguồn')+stat(D.totalDecisions,'Dòng quyết định trong quy trình mới')+stat('01','Bảng vai trò chung toàn chương trình')+'</div><div class="global-search"><label class="sr-only" for="globalSearch">Tìm trong 12 SOP</label><input type="search" id="globalSearch" placeholder="Tìm nội dung trong cả 12 SOP…"><button data-jump-roles>Đến bảng vai trò ↓</button></div><div id="globalResults" hidden></div><section><div class="section-head"><h2>Những điểm nên kiểm tra trước</h2><span class="small">Giữ nguyên nguồn để team xác nhận</span></div><div class="priority-grid">'+priority(byId('SOP-SGM-004'))+priority(byId('SOP-SGM-005'))+priority(byId('SOP-SGM-007'))+priority(byId('SOP-SGM-002'))+'</div><details class="more-notes"><summary>Xem các điểm cần kiểm tra khác</summary><div class="priority-grid">'+D.sops.filter(s=>!['SOP-SGM-004','SOP-SGM-005','SOP-SGM-007','SOP-SGM-002'].includes(s.id)).map(s=>priority(s)).join('')+priority(byId('SOP-GRA-001'),1)+'</div></details></section>'+roleTable()+'<section id="sopList"><div class="section-head"><h2>Chọn SOP để đối chiếu</h2><span class="small">Giữ nguyên tên và mã SOP</span></div><div class="sop-grid">'+D.sops.map(tile).join('')+'</div></section>';
 filterRoles();$('roleSearch').addEventListener('input',filterRoles);$('roleCategory').addEventListener('change',filterRoles);$('globalSearch').addEventListener('input',globalSearch);if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function filterRoles(){const q=norm($('roleSearch').value),cat=$('roleCategory').value;let count=0;D.roles.forEach(r=>{const yes=(cat==='all'||r.category===cat)&&(!q||norm(JSON.stringify(r)).includes(q));document.querySelector('[data-role-row="'+r.id+'"]').hidden=!yes;if(yes)count++});$('roleCount').textContent=count+' / '+D.roles.length+' vai trò / nhóm bên tham gia';}
function globalSearch(){const q=norm($('globalSearch').value.trim());if(!q){$('globalResults').hidden=true;return}let matches=[];D.sops.forEach(s=>s.cards.forEach(c=>{if(norm(s.title+' '+JSON.stringify(c)).includes(q))matches.push({s,c})}));$('globalResults').hidden=false;$('globalResults').innerHTML='<h2>'+matches.length+' nhóm nội dung phù hợp</h2>'+matches.map(({s,c})=>'<div class="search-hit"><span class="tag">'+esc(s.title)+'</span><span class="tag">'+esc(c.kind)+'</span><h3>'+esc(c.title)+'</h3><p>'+esc(c.summary)+'</p><button data-sop="'+s.id+'" data-target="'+c.id+'">Mở đối chiếu →</button></div>').join('')+(matches.length?'':'<p class="small">Không có kết quả. Thử một từ khóa khác.</p>');}
function raw(v){return v.length?v.map(r=>'<div class="raw-body"><strong class="raw-step-title">Bước '+esc(r.label)+'</strong>'+Object.entries(r.fields).filter(([k])=>k!=='#').map(([l,t])=>esc(l)+': '+(t?esc(t):'[Ô trống]')).join('\n')+'</div>').join(''):'<div class="empty-box">Không ghép bước trực tiếp trong nhóm này.</div>'}
function renderCard(c){let body=c.body||'';if(c.rows){body='<div class="side-labels"><span>TRƯỚC · '+esc(refs(c.old))+'</span><span>SAU · '+esc(refs(c.new))+'</span></div>'+c.rows.map(r=>'<div class="field '+(r.same?'same':'')+'"><div class="field-label">'+esc(r.label)+'</div><div class="paired"><div>'+r.a+'</div><div>'+r.b+'</div></div></div>').join('')+'<details class="raw"><summary>Nguyên văn các bước nguồn</summary><div class="side-labels"><span>TRƯỚC</span><span>SAU</span></div><div class="paired"><div>'+raw(c.rawOld)+'</div><div>'+raw(c.rawNew)+'</div></div></details>'}
 else if(!c.tags.includes('same')&&!c.tags.includes('structure'))body='<div class="side-labels"><span>TRƯỚC</span><span>SAU</span></div>'+body;
 if(c.tags.includes('same'))body='<details class="raw"><summary>Xem nội dung giữ nguyên</summary>'+body+'</details>';
 return '<article id="'+c.id+'" class="card '+(c.flag?'flag':'')+'"><div class="card-head"><div class="tags"><span class="tag">'+esc(c.kind)+'</span>'+c.tags.filter(t=>t!=='same').map(t=>'<span class="tag">'+labels[t]+'</span>').join('')+(c.flag?'<span class="tag warn">Cần xác nhận</span>':'')+'</div><h3>'+esc(c.title)+'</h3><p class="summary"><span class="ai">Nhận xét AI</span>'+esc(c.summary)+'</p></div>'+body+'</article>'}
function sourceTables(s,version){const ts=version==='old'?s.oldTables:s.newTables;return ts.map((t,i)=>{let title=i===0?'Document Information':i===1?'Purpose & Scope':t[0].includes('Step Description')?'Process Steps':t[0][0]==='Code'?'Roles & Responsibilities — nguồn cũ':t[0][0]==='Gap'?'Gap / Recommendation':t[0].includes('Condition / Decision Point')?'Decision Points & Exceptions':t[0][0]==='Reporting Field'?'Reporting':'Phần bảng tiếp nối';return '<div class="source-table"><h3>'+esc(title)+'</h3>'+table(t)+'</div>'}).join('')}
function showSop(id,target=null,scroll=true){const s=byId(id);if(!s)return;active=id;mode='compare';currentCards=s.cards;resetNav();const flagCount=s.cards.filter(c=>c.flag).length;$('screen').innerHTML='<div class="title-line"><h1>'+esc(s.title)+'</h1><a class="source-link" href="'+s.source+'" target="_blank" rel="noopener">Mở tab Google Docs nguồn ↗</a></div><p class="page-lead">'+esc(s.summary)+'</p><div class="stats">'+stat(s.oldCount+' → '+s.newCount,'Dòng bước đánh số trước → sau')+stat(changed(s),'Nhóm đối chiếu có thay đổi')+stat(s.decisions,'Dòng quyết định mới')+stat(flagCount,'Nhóm cần xác nhận')+'</div>'+s.alerts.map(a=>'<div class="notice"><strong>'+esc(a.title)+'</strong><p>'+esc(a.text)+'</p><button data-target="'+a.target+'">Đến nội dung liên quan →</button></div>').join('')+'<p class="small-info">Bản mới: '+s.blankOwners+'/'+s.newCount+' bước trống Responsible · '+s.blankDeadlines+'/'+s.newCount+' bước trống Deadline. Bảng vai trò được tổng hợp ở <button class="jump-chip" data-home-roles>trang tổng quan</button>.</p><div class="view-switch"><button class="active" id="compareMode" data-mode="compare">Đối chiếu thay đổi</button><button id="sourceMode" data-mode="source">Nguyên văn nguồn</button><button class="back-button" data-home>← Tổng quan</button></div><section id="comparePane"><div class="toolbar"><div class="controls"><label class="sr-only" for="search">Tìm trong SOP</label><input id="search" type="search" placeholder="Tìm trong SOP này…"><label class="sr-only" for="filter">Loại thay đổi</label><select id="filter"><option value="all">Mọi loại thay đổi</option><option value="owner">Trách nhiệm / thẩm quyền</option><option value="deadline">Thời hạn</option><option value="content">Nội dung</option><option value="tools">Tài nguyên</option><option value="structure">Dòng quyết định</option></select><button id="next">Thay đổi tiếp ↓</button></div><div class="toggles"><label><input type="checkbox" id="onlyChanged" checked>Chỉ nhóm có thay đổi</label><label><input type="checkbox" id="onlyFlag">Chỉ điểm cần xác nhận</label><label><input type="checkbox" id="compact" checked>Ẩn trường giữ nguyên</label></div><div class="legend"><span><del>Phần chữ cũ khác biệt</del> &nbsp; <ins>Phần chữ mới khác biệt</ins></span><span id="result" role="status" aria-live="polite"></span></div></div><div class="section-head"><h2>Đối chiếu theo nội dung</h2><span class="cards-subtitle">Các nhóm bước được ghép theo ý nghĩa; xem nguyên văn khi có gộp / tách.</span></div><div id="cards" class="compact">'+s.cards.map(renderCard).join('')+'</div><div class="zero" id="zero" hidden>Không có nhóm phù hợp.<br><button id="reset" style="margin-top:12px">Đặt lại bộ lọc</button></div></section><section id="sourcePane" hidden><p class="page-lead" style="margin-top:18px">Tất cả bảng của SOP trong hai nguồn, giữ thứ tự và nội dung ô. Bảng vai trò cũ vẫn có ở đây để kiểm chứng; bảng chung được trình bày ở tổng quan.</p><details class="source-pane" open><summary>TRƯỚC — '+esc(s.title)+' · '+s.oldCount+' dòng bước</summary>'+sourceTables(s,'old')+'</details><details class="source-pane" open><summary>SAU — '+esc(s.title)+' · '+s.newCount+' dòng bước</summary>'+sourceTables(s,'new')+'</details></section><button class="all-sops-return" data-home>← Quay về tổng quan 12 SOP</button>';
 ['search','filter','onlyChanged','onlyFlag','compact'].forEach(k=>$(k).addEventListener('input',update));$('reset').addEventListener('click',resetFilters);$('next').addEventListener('click',nextChange);update();if(scroll)window.scrollTo({top:0,behavior:'instant'});if(target)jump(target);}
function update(){const q=norm($('search').value.trim()),f=$('filter').value;visible=currentCards.filter(c=>(!$('onlyChanged').checked||!c.tags.includes('same'))&&(!$('onlyFlag').checked||c.flag)&&(f==='all'||c.tags.includes(f))&&(!q||norm(JSON.stringify(c)).includes(q)));currentCards.forEach(c=>$(c.id).hidden=!visible.includes(c));$('zero').hidden=visible.length>0;$('result').textContent=visible.length+' / '+currentCards.length+' nhóm';$('cards').classList.toggle('compact',$('compact').checked);}
function resetFilters(){$('search').value='';$('filter').value='all';$('onlyChanged').checked=true;$('onlyFlag').checked=false;update();}
function jump(id){const c=currentCards.find(c=>c.id===id);if(!c)return;setMode('compare');resetFilters();if(c.tags.includes('same')){$('onlyChanged').checked=false;update()}const e=$(id);e.scrollIntoView({behavior:'smooth',block:'start'});e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');}
function nextChange(){const vv=visible.filter(c=>!c.tags.includes('same'));if(!vv.length)return;const c=vv.find(c=>$(c.id).getBoundingClientRect().top>170)||vv[0];$(c.id).scrollIntoView({behavior:'smooth',block:'start'});}
function setMode(m){mode=m;$('comparePane').hidden=m!=='compare';$('sourcePane').hidden=m!=='source';$('compareMode').classList.toggle('active',m==='compare');$('sourceMode').classList.toggle('active',m==='source');}
function init(){let stage='';$('sopNav').innerHTML=D.sops.map(s=>{let h='';if(stage!==s.stage){stage=s.stage;h='<div class="stage-label">'+esc(stage)+'</div>'}return h+'<button class="nav-sop" data-sop="'+s.id+'"><span>'+esc(s.title)+'</span><small>'+s.oldCount+'→'+s.newCount+'</small></button>'}).join('');$('mobileSop').innerHTML='<option value="overview">Tổng quan & vai trò chung</option>'+D.sops.map(s=>'<option value="'+s.id+'">'+esc(s.title)+'</option>').join('');$('snapshotSide').textContent='Nguồn đọc: '+D.snapshot;$('footer').innerHTML=footer();$('mobileSop').addEventListener('change',e=>e.target.value==='overview'?showOverview():showSop(e.target.value));$('printBtn').addEventListener('click',()=>window.print());document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-home-roles')){showOverview();$('roles').scrollIntoView({behavior:'smooth'});}else if(b.hasAttribute('data-jump-roles')){$('roles').scrollIntoView({behavior:'smooth'});}else if(b.hasAttribute('data-home'))showOverview();else if(b.dataset.sop)showSop(b.dataset.sop,b.dataset.target||null);else if(b.dataset.target)jump(b.dataset.target);else if(b.dataset.mode)setMode(b.dataset.mode);});showOverview(false);}
init();
</script></body></html>
