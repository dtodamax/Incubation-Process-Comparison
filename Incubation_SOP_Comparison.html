 "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Purpose</th><th>This SOP standardizes the recruitment process for startup teams applying to the incubation program, from application submission to final selection and notification.</th></tr><tr><td>Scope</td><td>This SOP applies to all startup applications submitted through the official recruitment platform until the recruitment cycle is completed.</td></tr><tr><td>Trigger</td><td>A startup team submits an online application through the official application form.</td></tr><tr><td>End Condition</td><td>Selected startups receive admission notifications and invitations to Orientation Day. Recruitment records are archived after all applicants have been notified.</td></tr></table></div>"}, {"id": "SOP-REC-001-gap", "title": "Gap / Recommendation", "kind": "Chỉnh sửa bảng", "tags": ["content"], "flag": false, "summary": "Đối chiếu bảng nguyên văn. Với bảng thay đổi cấu trúc, không ghép ô theo vị trí.", "body": "<div class=\"paired\"><div><div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Quy trình review application hiện tại còn khá rộng, Program Staff phải kiểm tra thủ công các điều kiện eligibility và chưa có bước rõ ràng để chốt danh sách startup vào Interview Round sau khi SGA review.\nStep Interview hiện tại chưa bao gồm đầy đủ phần chuẩn bị interview, coordination với external experts và cách tổng hợp evaluation. \nĐiểm và comment của experts hiện còn được tổng hợp thủ công và có thể không được hoàn thành ngay sau interview. \nSau interview chưa có bước rõ ràng để finalize danh sách startup trúng tuyển.\nDữ liệu hiện được collect và xử lý qua nhiều form khác nhau; một số bước phải manually transfer data.\n\n</td><td>Bổ sung AI tool để hỗ trợ kiểm tra các tiêu chí eligibility của application, gồm: đối tượng sinh viên, startup dưới 2 năm thành lập và đã có MVP hay chưa, nhằm giảm việc Program Staff phải rà soát thủ công nhiều hồ sơ.\nSau khi SGA review, bổ sung một meeting khoảng 30 phút để chốt danh sách startup vào Interview Round.\nIP Manager là người finalize danh sách startup vào Interview Round dựa trên số vote của SGA và số lượng startup target cần đưa vào interview.\nBổ sung phần Interview Preparation vào bước Interview. Program Staff phụ trách logistics, confirm attendance và collect slides từ startup.\nIP Manager phụ trách làm việc với external experts, chuẩn bị evaluation form và trao đổi với experts. Có thể tăng thời gian cho từng interview slot để experts hoàn thành scoring ngay sau mỗi interview.\nKiểm tra experts đã hoàn thành việc fill điểm trước khi bắt đầu interview startup tiếp theo. Sử dụng một form đánh giá chung để hạn chế việc tổng hợp thủ công từ nhiều evaluation form riêng của từng expert.\nCuối buổi interview có thể tổ chức meeting nhanh khoảng 5 phút với experts để collect thêm các qualitative comments chưa được note trong form.\nSau khi có kết quả evaluation, bổ sung một meeting để finalize danh sách startup cuối cùng. Sau khi danh sách được finalize, Program Staff gửi email mời startup được chọn.\nTách nhỏ bước Application Review vì bước hiện tại đang quá rộng.\nKhông xây dựng nhiều platform riêng lẻ; các tính năng phục vụ process cần được triển khai dưới dạng functionality trên Innovation Platform.\nBổ sung role của Innovation Platform/Digital Transformation Team vào phần Responsibility của process.\nDigital Transformation Team cần chuẩn bị nền tảng trước khi bắt đầu nhận application/form đăng ký.</td></tr><tr><td>Quy trình review application hiện tại còn khá rộng, Program Staff phải kiểm tra thủ công các điều kiện eligibility và chưa có bước rõ ràng để chốt danh sách startup vào Interview Round sau khi SGA review.\nStep Interview hiện tại chưa bao gồm đầy đủ phần chuẩn bị interview, coordination với external experts và cách tổng hợp evaluation. \nĐiểm và comment của experts gắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Does the startup satisfy the eligibility requirements?</td><td>Proceed to interview invitation.</td><td>Send rejection email and close application.</td></tr><tr><td>2</td><td>Does the startup pass the interview evaluation?</td><td>Proceed to final approval.</td><td>Send rejection email.</td></tr><tr><td>3</td><td>Is the final selection approved by the Incubator Manager?</td><td>Notify selected startups and invite them to Orientation Day.</td><td>Return to review committee for reconsideration or reject application.</td></tr></table></div>"}, {"id": "SOP-REC-001-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Reporting Field</th><th>Details</th></tr><tr><td>Report Title</td><td>Startup Recruitment Summary Report</td></tr><tr><td>Reporting Frequency</td><td>Per Cohort</td></tr><tr><td>Report Prepared By</td><td>Program Staff</td></tr><tr><td>Submitted To</td><td>IP Manager and Vice Director</td></tr><tr><td>Submission Deadline</td><td>DD/MM/YYYY</td></tr><tr><td>Reporting Tool</td><td>Google Sheets</td></tr><tr><td>Minimum Report Contents</td><td>Total applications received\nEligible applications\nInterviewed startups\nAccepted startups\nRejected startups\nKey issues encountered\nImprovement recommendations</td></tr><tr><td>Distribution List</td><td>Program Staff, IP Manager, Vice Director</td></tr><tr><td>Archiving</td><td>Google Drive → Recruitment</td></tr></table></div>"}], "alerts": [{"title": "Phân công kỹ thuật", "text": "DT Team không còn ở Responsible của bước chuẩn bị nền tảng và AI screening. Vai trò này vẫn được nhắc trong Recommendation; cần xác nhận phân công.", "target": "SOP-REC-001-g0"}], "oldTables": [[["SOP ID", "SOP-REC-001 ", "Version", "1.0"], ["Process Name", "Recruitment \n", "", ""], ["Effective Date\n", "DD/MM/YYYY", "Review Date", "DD/MM/YYYY"], ["Process Owner", "IP Manager", "", ""], ["Lifecycle Stage", "Recruitment", "", ""]], [["Purpose", "This SOP standardizes the recruitment process for startup teams applying to the incubation program, from application submission to final selection and notification. "], ["Scope", "This SOP applies to all startup applications submitted through the official recruitment platform until the recruitment cycle is completed. "], ["Trigger", "A startup team submits an online application through the official application form. "], ["End Condition", "Selected startups receive admission notifications and invitations to Orientation Day. Recruitment records are archived after all applicants have been notified. "]], [["Code", "Role / Person", "Responsibilities in This Process"], ["PS", "Program Staff", "Coordinate the recruitment process, communicate with applicants, manage documents and schedules, prepare interview logistics, collect startup presentation slides, confirm attendance, and monitor the completion of expert evaluation forms."], ["SGA", "Startup Growth Associate", "Review applications, evaluate eligibility, and recommend shortlisted startups. "], ["USI", "USI Team", "Conduct startup interviews and evaluate project presentations. "], ["EXT", "External Experts", "Participate in interviews and provide independent assessments, complete the standardized evaluation form after each interview slot, and provide additional qualitative comments when required."], ["IPM", "IP Manager", "Finalize the interview shortlist based on SGA votes and the target number of interviewees; coordinate external experts and facilitate the final selection meeting."]], [["#", "Step Description", "Deadline", "Responsible", "External Involvement", "Tools / Resources"], ["1", "Prepare and test the application infrastructure, forms, automated emails, and data storage on the Innovation Platform.", "", "DT Team", "", "Innovation Platform; Application Form; Automated Email"], ["2", "Receive online applications from startup teams. The system automatically sends a confirmation email after each application is submitted, including confirmation of receipt and the expected result-announcement timeline.", "", "Program Staff", "", "Official application form and automated confirmation email"], ["3", "Conduct an initial AI-supported screening of applications against predefined eligibility requirements, including applicant eligibility, startup age, MVP status, and completeness of mandatory information.", "", "DT Team, Program Staff", "", "AI screening tool; Startup Eligibility Criteria"], ["4", "Send eligible applications and the screening summary to SGA for review, scoring, and voting.", "", "SGA", "", "Application Review and Voting Form"], ["5", "Conduct a 30-minute shortlist-finalization meeting after SGA review. The IP Manager finalizes the interview shortlist based on SGA votes, the agreed score threshold, and the target number of interviewees.", "", "IP Manager", "SGA, Program Staff", "SGA Voting Summary / Shortlist Report"], ["6", "Invite shortlisted startups to the interview round.", "", "Program Staff", "", "Email, Google Calendar"], ["7", "Invite external experts and confirm their availability, roles, and participation in the interview round.", "", "IP Manager", "External Experts", "Email"], ["8", "Finalize the interview schedule and arrange the required interview logistics.", "", "Program Staff, IP Manager", "", "Interview Schedule; Google Calendar; Logistics Checklist"], ["9", "Confirm startup attendance and collect presentation slides and other required materials. ", "", "Program Staff", "", ""], ["10", "Prepare and share the standardized evaluation form, scoring criteria, and scoring guidance with external experts.", "", "IP Manager", "", ""], ["11", "Conduct startup interviews", "", "USI Team", "External Experts", "Interview Schedule (Google Calendar)"], ["12", "Allocate sufficient time after each interview slot for experts to complete the evaluation form. Program Staff or the IP Manager checks completion before the next interview begins or the session closes.", "", "Program Staff, IP Manager", "External Experts", "Standardized Interview Evaluation Form"], ["13", "Consolidate all expert scores in one shared evaluation form or system that automatically aggregates results and highlights incomplete or significantly different scores.", "", "Program Staff", "External Experts", "Consolidated Evaluation Form / System (UEH Inno Platform)"], ["14", "Conduct a brief expert debrief of approximately five minutes at the end of each interview day to collect important qualitative comments not recorded in the evaluation form.", "", "IP Manager", "External Experts", "Interview Debrief Notes"], ["15", "Conduct a final selection meeting after interview scores and comments have been consolidated. The Vice Director makes the final admission decision.", "", "Vice Director", "IP Manager, USI Team", "Consolidated Interview Evaluation Report"], ["16", "Announce selection results to applicants and invite them to Orientation Day.", "", "Program Staff", "", "Email Notification"], ["Add more rows as needed. Each step should be a single, clearly defined action.", "", "", "", "", ""]], [["Gap", "Recommendation"], ["Quy trình review application hiện tại còn khá rộng, Program Staff phải kiểm tra thủ công các điều kiện eligibility và chưa có bước rõ ràng để chốt danh sách startup vào Interview Round sau khi SGA review.\nStep Interview hiện tại chưa bao gồm đầy đủ phần chuẩn bị interview, coordination với external experts và cách tổng hợp evaluation. \nĐiểm và comment của experts hiện còn được tổng hợp thủ công và có thể không được hoàn thành ngay sau interview. \nSau interview chưa có bước rõ ràng để finalize danh sách startup trúng tuyển.\nDữ liệu hiện được collect và xử lý qua nhiều form khác nhau; một số bước ags": ["owner"], "flag": true, "summary": "Đối chiếu bảng nguyên văn. Với bảng thay đổi cấu trúc, không ghép ô theo vị trí.", "body": "<div class=\"paired\"><div><div class=\"table-scroll\"><table><tr><td>SOP ID</td><td>SOP-REC-002</td><td>Version</td><td>1.0</td></tr><tr><td>Process Name</td><td>Communication</td><td></td><td></td></tr><tr><td>Effective Date</td><td>DD/MM/YYYY</td><td>Review Date</td><td>DD/MM/YYYY</td></tr><tr><td>Process Owner</td><td><del>Communication Team Lead </del>IP Manager</td><td></td><td></td></tr><tr><td>Lifecycle Stage</td><td>Recruitment</td><td></td><td></td></tr></table></div></div><div><div class=\"table-scroll\"><table><tr><td>SOP ID</td><td>SOP-REC-002</td><td>Version</td><td>1.0</td></tr><tr><td>Process Name</td><td>Communication</td><td></td><td></td></tr><tr><td>Effective Date</td><td>DD/MM/YYYY</td><td>Review Date</td><td>DD/MM/YYYY</td></tr><tr><td>Process Owner</td><td>IP Manager</td><td></td><td></td></tr><tr><td>Lifecycle Stage</td><td>Recruitment</td><td></td><td></td></tr></table></div></div></div>"}, {"id": "SOP-REC-002-scope", "title": "Purpose & Scope", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Purpose</th><th>To standardize communication activities that promote the incubation program, engage the startup ecosystem, and attract qualified startup applications through coordinated marketing and outreach campaigns.</th></tr><tr><td>Scope</td><td>Covers all communication activities from program launch until the recruitment campaign officially closes.</td></tr><tr><td>Trigger</td><td>The recruitment campaign is approved and scheduled for launch.</td></tr><tr><td>End Condition</td><td>Recruitment campaign concludes, the final application-closing announcement is published, and communication performance data is archived.</td></tr></table></div>"}, {"id": "SOP-REC-002-gap", "title": "Gap / Recommendation", "kind": "Chỉnh sửa bảng", "tags": ["content"], "flag": false, "summary": "Đối chiếu bảng nguyên văn. Với bảng thay đổi cấu trúc, không ghép ô theo vị trí.", "body": "<div class=\"paired\"><div><div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Quy trình hiện tại đang giống một Communication Plan hơn là SOP; chưa thể hiện rõ process owner, approval flow và các bước review hiệu quả campaign.\nNếu Communication Team Lead là sinh viên thì chưa phù hợp để lead toàn bộ communication cho một project lớn mà không có sự quản lý trực tiếp từ IP Manager. \nCampaign monitoring &amp; decision point: Chưa có các mốc review và measurable threshold để quyết định điều chỉnh hoặc extend recruitment campaign. \nCommunication hiện đang được hiểu chủ yếu là truyền thông, chưa bao quát các hoạt động nhằm thu hút startup từ các kênh khác ngoài open application. \nChưa thống nhất rõ giữa IP Manager và Communication Team về việc ai là người chủ động request bài viết, ai là người cập nhật form nội bộ, và cách align với quy trình vận hành của Communication Team.\nChưa có một hệ thống report thống nhất để theo dõi hiệu quả campaign theo thời gian.</td><td>IP Manager chịu trách nhiệm định hướng và finalize Communication Plan; Communication Team chịu trách nhiệm planning và execution. \nXác định rõ IP Manager là process owner của Communication SOP. Communication Team phụ trách execution và reporting, nhưng mọi định hướng chính và phê duyệt cuối cùng cần do IP Manager chịu trách nhiệm. \nBổ sung Campaign Review tại Day 10 và Day 20. Mỗi review cần có report về application volume, conversion và các communication metrics. Xây dựng decision threshold cụ thể; ví dụ nếu số application tại Day 20 thấp hơn 70% target thì xem xét extend recruitment deadline hoặc bổ sung recruitment activities. \nMở rộng phạm vi Communication thành Recruitment Communication &amp; Startup Hunting, bao gồm: open call promotion, referral activation, startup database outreach và partner/faculty network mobilization. \nChuẩn hóa cơ chế phối hợp giữa IP Manager và Communication Team. Sau khi Communication Plan được finalize, cần xác định rõ: ai request nội dung, ai viết bài, ai duyệt bài, ai đăng tải và ai chịu trách nhiệm follow-up execution để tránh bị miss task. \nXây dựng communication report template dùng chung cho các mốc review, theo dõi các chỉ số như reach, engagement, application source, số lượng application và conversion rate. Báo cáo cần được dùng làm căn cứ cho decision point trong campaign.</td></tr><tr><td>Quy trình hiện tại đang giống một Communication Plan hơn là SOP; chưa thể hiện rõ process owner, approval flow và các bước review hiệu quả campaign.\nNếu Communication Team Lead là sinh viên thì chưa phù hợp để lead toàn bộ communication cho một project lớn mà không có sự quản lý trực tiếp từ IP Manager. \nCampaign monitoring &amp; decision point: Chưa có các mốc review và measurable threshold để quyết định điều chỉnh hoặc extend recruitment campaign. \nCommunication hiện đang được hiểu chủ yếu là truyền thông, chưa bao quát các hoạt động nhằm thu hút startup từ các kênh khác ngoài open application. \nChưa thống nhất rõ giữa IP Manager và Communication Team về việc ai là người chủ động request bài viết, ai là người cập nhật form nội bộ, và cách align với quy trình vận hành của Communication Team.\nChưa có một hệ thống report thống nhất để theo dõi hiệu quả campaign theo thời gian.</td><td>IP Manager chịu trách nhiệm định hướng và finalize Communication Plan; Communication Team chịu trách nhiệm planning và execution. \nXác định rõ IP Manager là process owner của Communication SOP. Communication Team phụ trách execution và reporting, nhưng mọi định hướng chính và phê duyệt cuối cùng cần do IP Manager chịu trách nhiệm. \nBổ sung Campaign Review tại Day 10 và Day 20. Mỗi review cần có report về application volume, conversion và các communication metrics. Xây dựng decision threshold cụ thể; ví dụ nếu số appl ed onboarding timeline.</td></tr></table></div>"}, {"id": "SOP-ONB-001-gap", "title": "Gap / Recommendation", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Chưa đưa thông tin lên USI Hub, chưa có thời điểm cụ thể trong procedure để thực hiện việc này.\nKhông thu thập đầy đủ/kịp thời thông tin của startup để triển khai các bước tiếp theo trước Kick-off Meeting.\nQuá trình gửi email và thu thập thông tin còn thủ công, thiếu công cụ automation nên mất nhiều thời gian xử lý và tổng hợp thông tin từ từng email.\nViệc chuẩn bị/ký kết các giấy tờ còn thủ công: phải lấy thông tin cá nhân của từng startup và fill thông tin bằng tay; Team OP phải xử lý nhiều nên mất thời gian.\nMicrosoft Teams được tạo nhưng startup không sử dụng nhiều, thực tế mọi người thường trao đổi qua Zalo.</td><td>Có thể merge một số bước và thực hiện song song: B5–B6–B7; B2–B8; B12–B13.\nBổ sung cột deadline/thời gian hoàn thành cho từng bước trong quy trình.\nMột số công việc có thể bàn giao cho SGA thay vì dồn cho một người/Team OP, ví dụ TTUT, NDA… để SGA chủ động tạo và gửi cho startup.\nXây dựng Master Plan chung giữa Incubator và startup để hai bên cùng theo dõi tiến độ, làm single source of truth between Incubator and Startups.\nGửi Onboarding Email sớm hơn, khoảng\nB1–B2. Kiểm tra email báo đậu và onboarding email có trùng nội dung hay không.\nThay vì chờ startup reply email để confirm, sử dụng form để startup vừa xác nhận tham gia vừa cung cấp thông tin. Việc điền form được xem là xác nhận tham gia.\nThông tin trong form gồm: thông tin dự án; Founder + thành viên; CCCD/ngày cấp; TTLock; frequency sử dụng; basic metrics; đồng thời tổng hợp lại xem form cần có những thông tin gì.\nHướng dẫn sử dụng các nền tảng quản lý bằng video, do Orientation Day không triển khai được hoạt động 1-1; trong Kick-off Meeting có thể show lại và hướng dẫn startup.\nKick-off Meeting bắt buộc offline, trừ các startup remote.\nTrong vòng 2 tuần kể từ Kick-off Meeting, tổng hợp đầy đủ thông tin của startup → Conditions for Internal SGA Meeting.\nÁp dụng mail merge để xử lý thông tin/tài liệu.\nSử dụng Data Analysis System / Power BI để hỗ trợ việc phân tích dữ liệu và đưa ra quyết định.\nDữ liệu cần được sử dụng xuyên suốt trên nền tảng.</td></tr></table></div>"}, {"id": "SOP-ONB-001-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Has the startup confirmed participation?</td><td>Proceed with onboarding.</td><td>Follow up by email. Close admission if no response after the deadline.</td></tr><tr><td>2</td><td>Have all required agreements been signed?</td><td>Continue onboarding.</td><td>Hold onboarding until all agreements are completed.</td></tr><tr><td>3</td><td>Has the Growth Map and OKRs been approved?</td><td>Register startup in incubation systems.</td><td>Revise with Startup Growth Associate and conduct another review.</td></tr><tr><td>4</td><td>Has all onboarding information been completed?</td><td>Close onboarding process.</td><td>Request missing information before onboarding completion.</td></tr></table></div>"}, {"id": "SOP-ONB-001-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Reporting Field</th><th>Details</th></tr><tr><td>Report Title</td><td>Onboarding Completion Report</td></tr><tr><td>Reporting Frequency</td><td>Per Cohort</td></tr><tr><td>Report Prepared By</td><td>Program Staff</td></tr><tr><td>Submitted To</td><td>Incubator Manager</td></tr><tr><td>Submission Deadline</td><td>DD/MM/YYYY</td></tr><tr><td>Reporting Tool</td><td>Google Sheets</td></tr><tr><td>Minimum Report Contents</td><td>Number of startups onboarded\nNumber of agreements completed\nPlatform registration status\nOKRs completion status\nGrowth Map completion status\nOutstanding issues and risks\nRecommendations</td></tr><tr><td>Distribution List</td><td>Program Manager, Incubator Manager, Vice Director</td></tr><tr><td>Archiving</td><td>Google Drive → Onboarding → Cohort Folder</td></tr></table></div>"}, {"id": "SOP-ONB-001-inline-decisions", "title": "Dòng quyết định trong Process Steps", "kind": "Bổ sung dòng quyết định", "tags": ["structure", "content"], "flag": false, "summary": "2 dòng quyết định chèn trong quy trình mới, không tính là bước đánh số. Mục Decision Points & Exceptions riêng vẫn được đối chiếu bên trên.", "body": "<div class=\"added-text\">Decision Point: Has the startup confirmed participation by submitting the onboarding form? YES → Proceed with onboarding process. NO → Send reminder and close admission if no response.</div><div class=\"added-text\">Decision Point: Have the Growth Roadmap and OKRs been approved? YES → Continue platform registration and incubation tracking. NO → Revise OKRs/Growth Roadmap based on SGA feedback.</div>"}], "alerts": [{"title": "Người review / phê duyệt onboarding", "text": "Bước internal alignment thay USI Team bằng SGA / Program Staff. Bảng vai trò cũ giao USI Team review và approve onboarding package.", "target": "SOP-ONB-001-g6"}], "oldTables": [[["SOP ID", "SOP-ONB-001", "Version", "1.0"], ["Process Name", "Onboarding Management", "", ""], ["Effective Date\n", "DD/MM/YYYY", "Review Date", "DD/MM/YYYY"], ["Process Owner", "Incubator Manager", "", ""], ["Lifecycle Stage", "Onboarding", "", ""]], [["Purpose", "To standardize the onboarding process for newly selected startups, ensuring that all required administrative tasks, legal documents, strategic planning activities, and system registrations are completed before incubation begins."], ["Scope", "Applies to all startups that have successfully completed the recruitment process and are admitted to the incubation program."], ["Trigger", "Startup accepts the admission offer and confirms participation in the incubation program by submitting the centralized Onboarding Confirmation Form."], ["End Condition", "Startup is fully onboarded, registered in all program management systems, its information is uploaded to USI Hub and the centralized startup database, and ready to enter the incubation phase within the approved onboarding timeline. "]], [["Code", "Role / Person", "Responsibilities in This Process"], ["PS", "Program Staff", "Coordinate onboarding activities, communicate with startups, maintain records, and update management systems. Administer the centralized onboarding form, monitor completion deadlines, and coordinate data updates across onboarding systems. "], ["PM", "Program Manager", "Organize Orientation Day and supervise onboarding execution.  "], ["SGA", "Startup Growth Associate", "Support strategic planning, review startup information, facilitate OKRs and Growth Map development. Prepare and verify Incubation Agreements and NDAs using approved templates or mail merge, maintain the shared master plan, and double-check startup information before documents are issued. "], ["USI", "USI Team", "Review onboarding deliverables and approve the onboarding package."], ["FDR", "Startup Founders", "Submit required documents, attend onboarding activities, sign agreements, and complete strategic planning materials. Submit core onboarding information through the centralized form and update it only when changes occur. "], ["DT", "Digital Transformation / Innovation Platform Team", "Prepare the onboarding platform, centralized database, data fields and validation rules, workflow automation, USI Hub integration, and data-visualization support."  preparation, and execution of Orientation Day for newly admitted startups, ensuring all participants receive essential program information, complete required onboarding activities, and are prepared to begin the incubation program.</th></tr><tr><td>Scope</td><td>Applies to all Orientation Day activities conducted for newly selected startups before the official incubation period begins.</td></tr><tr><td>Trigger</td><td>Recruitment process is completed and the list of admitted startups has been approved.</td></tr><tr><td>End Condition</td><td>Orientation Day is completed, the pre-program survey and required orientation information are collected, and post-event follow-up activities have been assigned.</td></tr></table></div>"}, {"id": "SOP-ONB-002-gap", "title": "Gap / Recommendation", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Orientation Day có collect feedback nhưng chưa phân tích và sử dụng feedback để cải thiện chương trình như thế nào, đặc biệt để hiểu rõ nhu cầu và mong muốn của startup.</td><td>Thực hiện survey ở đầu Orientation Day trước khi chương trình bắt đầu, và có thể sử dụng lại vào cuối chương trình.\nSurvey dùng để đo lường status trước và sau chương trình, từ đó nhận biết sự chuyển hóa của startup.\nSurvey thu thập expectation của startup để đo lường và thiết kế chương trình phù hợp hơn.\nĐiều chỉnh lại các steps trong Orientation Day vì hiện còn thiếu nội dung và có role chưa phù hợp.</td></tr></table></div>"}, {"id": "SOP-ONB-002-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → td></tr><tr><td>End Condition</td><td>Growth Session outcomes, action items, and follow-up plans are documented and approved for implementation.</td></tr></table></div>"}, {"id": "SOP-SGM-002-gap", "title": "Gap / Recommendation", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Các buổi Growth Session hiện có thể phát sinh câu hỏi ngay trong lúc họp, chưa có cấu trúc chuẩn bị rõ ràng trước buổi meeting, dẫn đến startup và SGA chưa có đủ thời gian chuẩn bị nội dung.\nProcess hiện tập trung vào review, update và request information, nhưng chưa thể hiện rõ bước Implementation của Incubator/SGA sau khi đã thống nhất action với startup.\nViệc theo dõi SGA action sau cuộc họp chưa rõ ràng: cần biết action nào đã làm, chưa làm và tiến độ thực hiện.\nMột số startup không có số liệu metric mới sau mỗi chu kỳ 2 tuần, dẫn đến có trường hợp để trống dữ liệu.\nCác loại metric hiện có cách cập nhật khác nhau nhưng chưa phân biệt rõ metric nào dùng giá trị tại thời điểm và metric nào dùng số lũy kế.</td><td>Trước buổi Growth Session 1–2 ngày, SGA cập nhật nội dung/agenda của buổi họp trên Calendar và thông tin trước cho startup về các nội dung, next steps cần chuẩn bị.\nBổ sung bước Implementation sau khi chốt action: SGA thực hiện các hỗ trợ đã thống nhất như connect mentor, connect investor, connect community, tổ chức workshop hoặc các immediate actions khác.\nBổ sung task/action list để SGA cập nhật trạng thái thực hiện; các action có thể được theo dõi trên Startup Hub/Master Plan để biết việc nào đã hoàn thành và việc nào chưa.\nNếu không có dữ liệu mới thì không để trống, sử dụng “N/A” khi không có dữ liệu phù hợp.\nXác định rõ metric nào là giá trị tại thời điểm và metric nào là cumulative. Ví dụ số khách hàng nếu không thay đổi sau 2 tuần thì tiếp tục ghi lại số hiện tại thay vì để trống.\nSử dụng Master Plan đã xây dựng từ giai đoạn Onboarding để review trong các buổi internal meeting và theo dõi các action tiếp theo.</td></tr></table></div>"}, {"id": "SOP-SGM-002-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Is the startup progressing according to its OKRs and Growth Roadmap?</td><td>Continue with the current growth plan.</td><td>Revise the Growth Roadmap and define corrective actions.</td></tr><tr><td>2</td><td>Does the startup require additional support?</td><td>Arrange Office Hours, Shared Services, or mentor support.</td><td>Continue regular monitoring.</td></tr><tr><td>3</td><td>Are all agreed action items completed?</td><td>Schedule the next Growth Session.</td><td>Follow up with the startup and revise deadlines if necessary.</td></tr><tr><td>4</td><td>Does the startup require strategic intervention from the Program Owner?</td><td>Escalate the case to the internal review meeting.</td><td>Continue advisor-level support.</td></tr></table></div>"}, {"id": "SOP-SGM-002-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Reporting Field</th><th>Details</th></tr><tr><td>Report Title</td><td>Growth Session Report</td></tr><tr><td>Reporting Frequency</td><td>Bi - weekly</td></tr><tr><td>Report Prepared By</td><td>Startup Growth Associate</td></tr><tr><td>Submitted To</td><td>Program Owner</td></tr><tr><td>Submission Deadline</td><td>DD/MM/YYYY</td></tr><tr><td>Reporting Tool</td><td>Google Sheets</td></tr><tr><td>Minimum Report Contents</td><td>Startup progr ], "rawNew": [{"pos": 10, "label": "10", "fields": {"#": "10", "Step Description": "Collect startup feedback and optional expert feedback on the usefulness of the consultation.", "Deadline": "", "Responsible": "SGA", "External Involvement": "", "Tools / Resources": ""}}]}, {"id": "SOP-SGM-003-meta", "title": "Document Information", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>SOP ID</th><th>SOP-SGM-003</th><th>Version</th><th>1.0</th></tr><tr><td>Process Name</td><td>Office Hours</td><td></td><td></td></tr><tr><td>Effective Date</td><td>DD/MM/YYYY</td><td>Review Date</td><td>DD/MM/YYYY</td></tr><tr><td>Process Owner</td><td>Startup Growth Associate</td><td></td><td></td></tr><tr><td>Lifecycle Stage</td><td>Incubation</td><td></td><td></td></tr></table></div>"}, {"id": "SOP-SGM-003-scope", "title": "Purpose & Scope", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Purpose</th><th>To standardize the Office Hours process by connecting startups with suitable experts or mentors to address business challenges, validate solutions, and support startup growth through one-on-one consultation sessions.</th></tr><tr><td>Scope</td><td>Applies to all startups participating in the incubation program that require expert consultation or specialized business support.</td></tr><tr><td>Trigger</td><td>A startup requests an Office Hours session or the Startup Growth Associate identifies the need for expert support.</td></tr><tr><td>End Condition</td><td>The consultation session is completed, action items are documented, and follow-up activities are assigned.</td></tr></table></div>"}, {"id": "SOP-SGM-003-gap", "title": "Gap / Recommendation", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Trước khi match expert/mentor, SGA cần biết database hiện có những mentor/expert nào và expertise của họ, nhưng phần này chưa được thể hiện rõ trong process.\nTrước khi kết nối startup với expert, chưa có một document chuẩn giúp expert hiểu startup đang ở status nào, vấn đề cần tư vấn là gì và startup muốn hỏi những gì.\nProcess hiện chưa thể hiện rõ việc ghi nhận đầy đủ insights của expert sau buổi Office Hours để có thể đánh giá buổi hỗ trợ có tác động hay không.\nChưa có cơ chế rõ ràng để đánh giá hiệu quả của Office Hours.\nOffice Hours và Mentoring chưa được phân biệt đủ rõ về mục tiêu và cách vận hành.</td><td>Trước khi đề xuất expert, SGA review database mentor/expert hiện có để xác định nguồn lực phù hợp với vấn đề của startup\nChuẩn bị briefing/document trước Office Hours, gồm status của startup, vấn đề cần hỗ trợ, các câu hỏi và thông tin liên quan; sau đó SGA dùng nội dung này để giới thiệu và kết nối expert qua email.\nSau buổi Office Hours, ghi nhận nội dung tư vấn, guidance/insights và kết quả của buổi meeting theo một template thống nhất. Nếu không có next action cụ thể thì phần next action có thể để trống.\nBổ sung feedback form sau buổi Office Hours để startup đánh giá hiệu quả; có thể thu thêm feedback từ expert khi cần.\nXác định Office Hours là một support/action nhỏ phát sinh từ nhu cầu cụ thể trong Growth Session/Master Plan, chủ yếu giúp founder có thêm opinion/perspective; Mentoring là hoạt động đồng hành định kỳ và dài hơn.\nSử dụng Google Docs theo template để tổng hợp startup, consultant/expert, key deliverables, recommendations và cập nhật thông tin lên Hub thay vì chỉ tổng hợp trên Google Sheets.\nPlanning/Preparation cho Office Hours có thể gộp các nội dung: thời gian, địa điểm, câu hỏi, tài liệu gửi expert để expert nắm progress của startup và email xác nhận lịch.\nSGA không bắt buộc phải tham dự mọi Office Hours; có thể tham gia khi cần. Việc recording cũng cần cân nhắc và phải xin consent nếu thực hiện.</td></tr></table></div>"}, {"id": "SOP-SGM-003-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Is the startup&#x27;s request suitable for Office Hours?</td><td>Schedule an Office Hours session.</td><td>Refer the request to another incubation support service.</td></tr><tr><td>2</td><td>Is a suitable expert available?</td><td>Confirm the consultation session.</td><td>Identify an alternative expert or reschedule the session.</td></tr><tr><td>3</td><td>Are follow-up actions required after the consultation?</td><td>Monitor implementation and schedule additional support if needed.</td><td>Close the Office Hours case.</td></tr><tr><td>4</td><td>Does the startup require further specialized support?</td><td>Arrange additional Office Hours, Shared Services, or Mentoring sessions.</td><td>Continue regular Growth Sessions.</td></tr></table></div>"}, {"id": "SOP-SGM-003-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Reporting Field</th><th>Details</th></tr><tr><td>Report Title</td><td>Office Hours Report</td></tr><tr><td>Reporting Frequency</td><td>Per Session / Monthly</td></tr><tr><td>Report Prepared By</td><td>Startup Growth Associate</td></tr><tr><td>Submitted To</td><td>Program Manager</td></tr><tr><td>Submission Deadline</td><td>DD/MM/YYYY</td></tr><tr><td>Reporting Tool</td><td>Google Sheets</td></tr><tr><td>Minimum Report Contents</td><td>Startup information\nConsultation topic\nAssigned expert\nKey discussion points\nRecommendations provided\nAction items\nFollow-up status</td></tr><tr><td>Distribution List</td><td>Startup Growth Associate, Program Owner, USI Team</td></tr><tr><td>Archiving</td><td>Google Drive → Startup Growth Management</td></tr></table></div>"}], "alerts": [{"title": "Điều phối và tư vấn chuyên môn", "text": "Bước thực hiện tư vấn chuyển Expert / Mentor ở Responsible sang SGA; Expert xuất hiện ở External Involvement.", "target": "SOP-SGM-003-g4"}], "oldTables": [[["SOP ID", "SOP-SGM-003", "Version", "1.0"], ["Process Name", "Office Hours", "", ""], ["Effective Date\n", "DD/MM/YYYY", "Review Date", "DD/MM/YYYY"], ["Process Owner", "Startup Growth Associate", "", ""], ["Lifecycle Stage", "Incubation", "", ""]], [["Purpose", "To standardize the Office Hours process by connecting startups with suitable experts or mentors to address business challenges, validate solutions, and support startup growth through one-on-one consultation sessions. "], ["Scope", "Applies to all startups participating in the incubation program that require expert consultation or specialized business support. "], ["Trigger", "A startup requests an Office Hours session or the Startup Growth Associate identifies the need for expert support."], ["End Condition", "The consultation session is completed, action items are documented, and follow-up activities are assigned."]], [["Code", "Role / Person", "Responsibilities in This Process"], ["SGA", "Startup Growth Associate", "Assess startup needs, coordinate Office Hours, document outcomes, and monitor follow-up actions."], ["EXP", "Expert", "Provide professional advice, practical recommendations, and strategic guidance during the consultation session. "], ["FDR", "Startup Founders", "Present business challenges, actively participate in discussions, and implement agreed action plans. "], ["PM", "Program Manager", "Support expert allocation and res mprovements for future workshops. ", "Responsible": "Program Staff", "External Involvement": "", "Tools / Resources": "Feedback Form"}}], "rawNew": [{"pos": 10, "label": "10", "fields": {"#": "10", "Step Description": "Collect attendance, feedback, learning results, and online metrics such as views or completion where applicable.", "Deadline": "", "Responsible": "Program Staff", "External Involvement": "", "Tools / Resources": ""}}, {"pos": 11, "label": "11", "fields": {"#": "11", "Step Description": "Evaluate learning effectiveness and document improvements.", "Deadline": "", "Responsible": "Program Staff", "External Involvement": "", "Tools / Resources": ""}}]}, {"id": "SOP-SGM-006-meta", "title": "Document Information", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>SOP ID</th><th>SOP-SGM-006</th><th>Version</th><th>1.0</th></tr><tr><td>Process Name</td><td>ETP Workshop</td><td></td><td></td></tr><tr><td>Effective Date</td><td>DD/MM/YYYY</td><td>Review Date</td><td>DD/MM/YYYY</td></tr><tr><td>Process Owner</td><td>Program Manager</td><td></td><td></td></tr><tr><td>Lifecycle Stage</td><td>Incubation</td><td></td><td></td></tr></table></div>"}, {"id": "SOP-SGM-006-scope", "title": "Purpose & Scope", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Purpose</th><th>To standardize the planning, preparation, delivery, and evaluation of ETP Workshop activities, ensuring startups receive practical entrepreneurship knowledge, business development skills, and learning resources aligned with the incubation roadmap.</th></tr><tr><td>Scope</td><td>Applies to all ETP Workshop sessions organized for startups participating in the incubation program.</td></tr><tr><td>Trigger</td><td>An ETP Workshop is scheduled in the incubation roadmap or approved by the Program Manager.</td></tr><tr><td>End Condition</td><td>The workshop is completed, learning materials are archived, participant feedback is collected, and improvement actions are documented.</td></tr></table></div>"}, {"id": "SOP-SGM-006-gap", "title": "Gap / Recommendation", "kind": "Chỉnh sửa bảng", "tags": ["content"], "flag": false, "summary": "Đối chiếu bảng nguyên văn. Với bảng thay đổi cấu trúc, không ghép ô theo vị trí.", "body": "<div class=\"paired\"><div><div class=\"table-scroll\"><table><tr><td>Gap</td><td>Recommendation</td></tr><tr><td>ETP Online hiện chưa có process rõ ràng, trong khi SOP hiện tại đang gộp online và offline chung. Chưa <del>xác định rõ ai phụ trách làm việc với vendor trong quá trình sản xuất ETP Online. Chưa </del>có cơ chế rõ ràng để đánh giá hiệu quả của ETP Online.</td><td>Nếu tiếp tục đưa ETP Online vào SOP, cần xây dựng phần process riêng cho online, gồm topic, speaker, format và cách triển khai. <del>Xác định role phụ trách vendor và các hoạt động logistics online như book studio, vendor quay phim/chụp hình, chỉnh sửa hình ảnh và phối hợp speaker. </del>Xây dựng cơ chế đánh giá như lượt xem, cách học, mức độ hiệu quả, và cân nhắc bài tập trực tiếp trên nền tảng/Hub. Trước khi sản xuất ETP Online, Program Manager xây dựng/đề xuất topic, speaker, training content và format video. Chuẩn bị presentation slides và các learning materials tương ứng với nội dung online. Có một ý kiến trong workshop rằng ETP Online mang tính project production, không lặp lại theo từng cohort, vì vậy cần cân nhắc có thực sự cần một SOP riêng cho ETP Online hay không thay vì mặc định phải tạo.</td></tr></table></div></div><div><div class=\"table-scroll\"><table><tr><td>Gap</td><td>Recommendation</td></tr><tr><td>ETP Online hiện chưa có process rõ ràng, trong khi SOP hiện tại đang gộp online và offline chung. Chưa có cơ chế rõ ràng để đánh giá hiệu quả của ETP Online.</td><td>Nếu tiếp tục đưa ETP Online vào SOP, cần xây dựng phần process riêng cho online, gồm topic, speaker, format và cách triển khai. Xây dựng cơ chế đánh giá như lượt xem, cách học, mức độ hiệu quả, và cân nhắc bài tập trực tiếp trên nền tảng/Hub. Trước khi sản xuất ETP Online, Program Manager xây dựng/đề xuất topic, speaker, training content và format video. Chuẩn bị presentation slides và các learning materials tương ứng với nội dung online. Có một ý kiến trong workshop rằng ETP Online mang tính project production, không lặp lại theo từng cohort, vì vậy cần cân nhắc có thực sự cần một SOP riêng cho ETP Online hay không thay vì mặc định phải tạo.</td></tr></table></div></div></div>"}, {"id": "SOP-SGM-006-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Has the workshop content been approved?</td><td>Proceed with workshop preparation.</td><td>Revise and resubmit for approval.</td></tr><tr><td>2</td><td>Is the assigned speaker available?</td><td>Confirm the workshop schedule.</td><td>Arrange another speaker or reschedule.</td></tr><tr><td>3</td><td>Are all workshop materials ready?</td><td>Conduct the ETP Workshop.</td><td>Complete the remaining preparation before delivery.</td></tr><tr><td>4</td><td>Is additional training required after the workshop?</td><td>Schedule another ETP Workshop, Office Hours, or Mentoring session.</td><td>Close the workshop and archive materials.</td></tr></table></div>"}, {"id": "SOP-SGM-006-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Reporting Field</th><th> s, mentors, experts, investors, and ecosystem partners.</th></tr><tr><td>Scope</td><td>Applies to all Sip &amp; Share events organized for startups participating in the incubation program and invited ecosystem stakeholders.</td></tr><tr><td>Trigger</td><td>A Sip &amp; Share session is scheduled in the incubation calendar or approved by the Program Manager.</td></tr><tr><td>End Condition</td><td>The event is completed, participant feedback is collected, and lessons learned are documented for future sessions.</td></tr></table></div>"}, {"id": "SOP-SGM-007-gap", "title": "Gap / Recommendation", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Nếu có người cần phiên dịch, thì nên chốt sớm chứ không để sát ngày diễn ra\nNote các trường hợp đặc biệt cần hỗ trợ và trao đổi về planning trước sipnshare\n\nTrong năm đã chốt PIC cho mỗi sipnshare, người đc PIC phải submit plan ít nhất 1 tháng trước ngày diễn ra. Nếu cần sẽ có buổi họp sipnshare (hoặc có thể trong weekly meeting gần nhất), plan tương tự như tổ chức ETP ws\nliên quan tới việc về người tham gia, remind người tham gia liên tục để họ tham gia sipnshare\ncollect fb: format pre and post survey tương tự như etp ws (không quá detailed, đơn giản hơn), fb cuối chtrinh rất qtrong, cố gắng push các startup làm\nngười PIC sau ctrinh sẽ ktra lại các startup họ đã điền hết fb chưa, nếu chưa thì có thể nhờ SGA để yêu cầu các startup điền.\nTổng hợp step logistic và supplier, checklist\nĐối với evt như sipnshare, cần có checklist standardize và chi tiết hơn cho tất cả việc cần làm và dựa trên checklist đó để triển khai (vdu teabreak đã đặt chưa?,...)\nSpeaker cần phải bám theo agenda và nội dung sipnshare, in case speaker từ chối thì có thể mời speaker khác.\nCó thể gộp những step về planning thành 1 step chung, trong đó có các đầu mục cần xác định (topic, speaker, value,...)</td><td>Đối với các step: Có thể gộp những step về planning thành 1 step chung, Đối với evt như sipnshare, cần có checklist standardize và chi tiết hơn cho tất cả việc cần làm và dựa trên checklist đó để triển khai (vdu teabreak đã đặt chưa?,...)\nTrong năm đã chốt PIC cho mỗi sipnshare, người đc PIC phải submit plan ít nhất 1 tháng trước ngày diễn ra. Nếu cần sẽ có buổi họp sipnshare (hoặc có thể trong weekly meeting gần nhất), plan tương tự như tổ chức ETP ws\nGộp planning lại thành tệp chung: topics, potential speaker, venue, logistics (1 bộ database chung cần có vendor là ai, cần cbi những gì)\ncollect fb: format pre and post survey tương tự như etp ws (không quá detailed, đơn giản hơn), fb cuối chtrinh rất qtrong, cố gắng push các startup làm\nngười PIC sau ctrinh sẽ ktra lại các startup họ đã điền hết fb chưa, nếu chưa thì có thể nhờ SGA để yêu cầu các startup điền.</td></tr></table></div>"}, {"id": "SOP-SGM-007-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Has the event topic been approved?</td><td>Proceed with event preparation.</td><td>Revise the topic and obtain approval.</td></tr><tr><td>2</td><td>Have speakers confirmed participation?</td><td>Finalize the event schedule.</td><td>Invite replacement speakers or reschedule the session.</td></tr><tr><td>3</td><td>Are follow-up activities required after the event?</td><td>Schedule future networking sessions, mentoring, or Office Hours.</td><td>Archive the event and close the activity.</td></tr></table></div>"}, {"id": "SOP-SGM-007-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau nce awards, conduct appreciation activities, and complete Demo Day closing activities.", "Deadline": "End of Demo Day", "Responsible": "Program Staff", "External Involvement": "", "Tools / Resources": ""}}]}, {"id": "SOP-SGM-008-g10", "title": "Feedback, cơ hội và báo cáo", "kind": "Gộp / phân bổ lại", "tags": ["content", "deadline", "owner", "tools"], "flag": false, "summary": "Tách ghi nhận leads / owners / follow-up deadlines và báo cáo / lưu trữ; cột Deadline của hai bước vẫn trống.", "rows": [{"label": "Nội dung bước", "a": "Collect <del>post-event </del>feedback, <del>track </del>investment <del>opportunities, partnership discussions, </del>and <del>schedule </del>follow-up <del>activities.</del>", "b": "Collect feedback, <ins>record </ins>investment <ins>leads, assign owners, </ins>and <ins>define </ins>follow-up <ins>deadlines. Complete Demo Day report, update opportunity tracking, archive records, and close the process.</ins>", "same": false}, {"label": "Thời hạn", "a": "<span class=\"empty\">Không có cột này trong bản cũ</span>", "b": "<span class=\"empty\">Ô trống trong nguồn</span>", "same": false}, {"label": "Phụ trách", "a": "Program Staff", "b": "<ins>Program Staff </ins>Program Staff", "same": false}, {"label": "Bên tham gia", "a": "<span class=\"empty\">Ô trống trong nguồn</span>", "b": "<span class=\"empty\">Ô trống trong nguồn</span>", "same": true}, {"label": "Công cụ / tài nguyên", "a": "<del>Reflection Form (Google Form)</del>", "b": "<span class=\"empty\">Ô trống trong nguồn</span>", "same": false}], "old": ["10"], "new": ["15", "16"], "rawOld": [{"pos": 10, "label": "10", "fields": {"#": "10", "Step Description": "Collect post-event feedback, track investment opportunities, partnership discussions, and schedule follow-up activities. ", "Responsible": "Program Staff", "External Involvement": "", "Tools / Resources": "Reflection Form\n(Google Form)"}}], "rawNew": [{"pos": 15, "label": "15", "fields": {"#": "15", "Step Description": "Collect feedback, record investment leads, assign owners, and define follow-up deadlines.", "Deadline": "", "Responsible": "Program Staff", "External Involvement": "", "Tools / Resources": ""}}, {"pos": 16, "label": "16", "fields": {"#": "16", "Step Description": "Complete Demo Day report, update opportunity tracking, archive records, and close the process.", "Deadline": "", "Responsible": "Program Staff", "External Involvement": "", "Tools / Resources": ""}}]}, {"id": "SOP-SGM-008-meta", "title": "Document Information", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>SOP ID</th><th>SOP-SGM-008</th><th>Version</th><th>1.0</th></tr><tr><td>Process Name</td><td>Demo Day</td><td></td><td></td></tr><tr><td>Effective Date</td><td>DD/MM/YYYY</td><td>Review Date</td><td>DD/MM/YYYY</td></tr><tr><td>Process Owner</td><td>Program Manager</td><td></td><td></td></tr><tr><td>Lifecycle Stage</td><td>Incubation</td><td></td><td></td></tr></table></div>"}, {"id": "SOP-SGM-008-scope", "title": "Purpose & Scope", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Purpose</th><th>To standardize the planning, preparation, execution, and post-event follow-up of Demo Day, providing startups with opportunities to showcase their achievements, pitch to investors, establish strategic partnerships, and conclude the incubation program.</th></tr><tr><td>Scope</td><td>Applies to all Demo Day activities involving participating startups, investors, mentors, ecosystem partners, judges, and event stakeholders.</td></tr><tr><td>Trigger</td><td>The incubation program reaches its final stage and the Program Manager approves the Demo Day event plan.</td></tr><tr><td>End Condition</td><td>Demo Day is completed, awards are announced, post-event feedback is collected, and follow-up activities with investors and partners are initiated.</td></tr></table></div>"}, {"id": "SOP-SGM-008-gap", "title": "Gap / Recommendation", "kind": "Chỉnh sửa bảng", "tags": ["content"], "flag": false, "summary": "Đối chiếu bảng nguyên văn. Với bảng thay đổi cấu trúc, không ghép ô theo vị trí.", "body": "<div class=\"paired\"><div><div class=\"table-scroll\"><table><tr><td>Gap</td><td>Recommendation</td></tr><tr><td>Demo Day hiện chưa thực sự phù hợp với đặc điểm của các startup trong cohort, vì phần lớn startup vẫn ở giai đoạn early-stage. Mặc dù có VC tham gia và trao đổi với startup, tỷ lệ startup nhận được hỗ trợ/đầu tư từ VC còn thấp. Với giai đoạn này, startup có thể phù hợp hơn với angel investor, nhưng hiện mạng lưới angel investor còn hạn chế. Nguồn angel investor còn thiếu và chưa có nhiều cơ hội để startup gặp gỡ họ thường xuyên. Với startup early-stage, angel investor cần nhiều lần tiếp xúc/pitching để duy trì interest và xây dựng niềm tin trước khi đưa ra quyết định. Việc tìm kiếm/crawl thông tin investor hiện còn thủ công, gây khó khăn cho việc duy trì và mở rộng mạng lưới investor phục vụ Demo Day. Chưa có cách rõ ràng để verify chất lượng của investor ecosystem mà chương trình đang xây dựng. <del>hưa </del>có tiêu chí/cách thức rõ ràng để lựa chọn những angel investor thực sự có tâm huyết và sẵn sàng đồng hành, chia sẻ với thế hệ startup tiếp theo.</td><td>Overall, các process steps của Demo Day hiện tương đối hoàn chỉnh, chủ yếu cần bổ sung chi tiết hơn các nội dung execution và công tác chuẩn bị trước sự kiện. Crawl data về các quỹ đầu tư và investor trước sự kiện ít nhất 1 tháng, trong đó có thể khai thác nguồn UEH Alumni. Đầu tư xây dựng database angel investor/investor, lưu các thông tin cần thiết như LinkedIn, email và các thông tin liên hệ liên quan để có thể tái sử dụng cho các sự kiện sau. Hỏi trực tiếp startup về các quỹ đầu tư hoặc angel investor mà startup mong muốn được gặp tại Demo Day để hỗ trợ việc xác định và mời đúng đối tượng. Bổ sung checklist chuẩn bị Demo Day chi tiết, bao gồm: startup portfolio, các tools hỗ trợ, speed dating, phiên dịch trong chương trình và các case cần lưu ý. Chuẩn bị Level-up Program trước Demo Day ít nhất 1 tháng; liên hệ mentor trước khoảng 2 tuần. Có thể sử dụng procedure của ETP Workshop để áp dụng cho phần training của Level-up Program. S3 – Invitation: Gửi thư mời tới UEH Alumni và angel investor, đồng thời chuẩn bị một proposal tổng hợp các startup/dự án tham gia để investor có thể scan trước và biết rõ những dự án họ sẽ gặp/nghe pitching khi tham dự Demo Day. Bổ sung bước send out information để đảm bảo các thông tin cần thiết được gửi đầy đủ đến investor và các bên tham gia trước sự kiện. Chuyển Demo Day từ một sự kiện one-time thành một chuỗi hoạt động, trong đó Demo Day là sự kiện tổng kết sau các hoạt động pitching/interaction nhỏ diễn ra trước đó. Thay vì tổ chức các mini-pitching đơn thuần, có thể tổ chức các buổi feedback + mentoring trong khoảng 2–3 tháng trước Demo Day. Mời angel investor tham gia với vai trò mentor để feedback sản phẩm và theo dõi sự phát triển của startup theo thời gian. Các buổi feedback + mentoring giúp investor nhìn thấy quá trình startup phát triển, thay vì chỉ gặp startup một lần tại Demo Day. Bổ sung không gian showcase/triển lãm thường trực để startup có thể trưng bày sản phẩm và tạo thêm cơ hội cho investor, đối tác và ecosystem tiếp cận sản phẩm của startup.</td></tr></table></div></div><div><div class=\"table-scroll\"><table><tr><td>Gap</td><td>Recommendation</td></tr><tr><td>Demo Day hiện chưa thực sự phù hợp với đặc điểm của các startup trong cohort, vì phần lớn startup vẫn ở giai đoạn early-stage. Mặc dù có VC tham gia và trao đổi với startup, tỷ lệ startup nhận được hỗ trợ/đầu tư từ VC còn thấp. Với giai đoạn này, startup có thể phù hợp hơn với angel investor, nhưng hiện mạng lưới angel investor còn hạn chế. Nguồn angel investor còn thiếu và chưa có nhiều cơ h các hoạt động pitching/interaction nhỏ diễn ra trước đó. Thay vì tổ chức các mini-pitching đơn thuần, có thể tổ chức các buổi feedback + mentoring trong khoảng 2–3 tháng trước Demo Day. Mời angel investor tham gia với vai trò mentor để feedback sản phẩm và theo dõi sự phát triển của startup theo thời gian. Các buổi feedback + mentoring giúp investor nhìn thấy quá trình startup phát triển, thay vì chỉ gặp startup một lần tại Demo Day. Bổ sung không gian showcase/triển lãm thường trực để startup có thể trưng bày sản phẩm và tạo thêm cơ hội cho investor, đối tác và ecosystem tiếp cận sản phẩm của startup.</td></tr></table></div></div></div>"}, {"id": "SOP-SGM-008-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Are investment or partnership opportunities identified during the event?</td><td>Schedule follow-up meetings and continue engagement.</td><td>Record networking outcomes and close the event.</td></tr><tr><td>2</td><td>Has all post-event documentation been completed?</td><td>Archive the event and close Demo Day.</td><td>Complete outstanding reports and follow-up activities before closure.</td></tr></table></div>"}, {"id": "SOP-SGM-008-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Reporting Field</th><th>Details</th></tr><tr><td>Report Title</td><td>Demo Day Report</td></tr><tr><td>Reporting Frequency</td><td>Per Event</td></tr><tr><td>Report Prepared By</td><td>Program Staff</td></tr><tr><td>Submitted To</td><td>Program Manager</td></tr><tr><td>Submission Deadline</td><td>DD/MM/YYYY</td></tr><tr><td>Reporting Tool</td><td>Google Sheets</td></tr><tr><td>Minimum Report Contents</td><td>Number of participating startups\nNumber of investors, judges, and partners\nAttendance statistics\nStartup Award results\nInvestment opportunities identified\nPartnership discussions\nParticipant feedback\nRecommendations for future Demo Days</td></tr><tr><td>Distribution List</td><td>Program Manager, Incubator Manager, Vice Director</td></tr><tr><td>Archiving</td><td>Google Drive → Startup Growth Management → Demo Day</td></tr></table></div>"}, {"id": "SOP-SGM-008-inline-decisions", "title": "Dòng quyết định trong Process Steps", "kind": "Bổ sung dòng quyết định", "tags": ["structure", "content"], "flag": false, "summary": "2 dòng quyết định chèn trong quy trình mới, không tính là bước đánh số. Mục Decision Points & Exceptions riêng vẫn được đối chiếu bên trên.", "body": "<div class=\"added-text\">DECISION POINT: Are sufficient relevant investors and partners confirmed? YES → Proceed with matching preparation. NO → Conduct targeted outreach and activate backup contacts.</div><div class=\"added-text\">DECISION POINT: Were investment or partnership opportunities identified? YES → Schedule follow-up meetings and continue engagement. NO → Record outcome and close opportunity tracking.</div>"}], "alerts": [{"title": "Matching chuyển người phụ trách", "text": "Bước matching chuyển Responsible từ Startup sang Program Staff. Hai bước sau sự kiện chưa có Deadline trong cột riêng.", "target": "SOP-SGM-008-g4"}], "oldTables": [[["SOP ID", "SOP-SGM-008", "Version", "1.0"], ["Process Name", "Demo Day", "", ""], ["Effective Date\n", "DD/MM/YYYY", "Review Date", "DD/MM/YYYY"], ["Process Owner", "Program Manager", "", ""], ["Lifecycle Stage", "Incubation", "", ""]], [["Purpose", "To standardize the planning, preparation, execution, and post-event follow-up of Demo Day, providing startups with opportunities to showcase their achievements, pitch to investors, establish strategic partnerships, and conclude the incubation program."], ["Scope", "Applies to all Demo Day activities involving participating startups, investors, mentors, ecosystem partners, judges, and event stakeholders. "], ["Trigger", "The incubation program reaches its final stage and the Program Manager approves the Demo Day event plan."], ["End Condition", "Demo Day is completed, awards are announced, post-event feedback is collected, and follow-up activities with investors and partners are initiated."]], [["Code", "Role / Person", "Responsibilities in This Process"], ["PM", "Program manager", "Approve the Demo Day plan and supervise overall event execution."], ["PS", "Program Staff", "Plan, coordinate, organize, and manage Demo Day operations. "], ["FDR", "Startup Founders", "Prepare pitch materials, participate in showcase activities, and present to investors. "], ["PAR", "Ecosystem partners", "Participate in networking activities and partnership discussions."], ["INV", "Investors", "Evaluate startups, provide feedback, and explore investment opportunities."]], [["#", "Step Description", "Responsible", "External Involvement", "Tools / Resources"], ["1", "Confirm participating startups, investors, mentors, corporate partners, and event stakeholders. ", "Program Staff", "", "Registration Form (Google Form)"], ["2", "Organize the Level-up Program to prepare startups for fundraising, investor readiness, and pitching. ", "Program Staff", "", "\n"], ["3", "Collect startup pitch decks, company profiles, showcase materials, and investor meeting preferences. ", "Program Staff", "", ""], ["4", "Match startups with investors and create Speed Dating and Investor Networking schedules. ", "Startup ", "", "Matching Form (Google Form)"], ["5", "Prepare event logistics, startup showcase area, pitching schedule, voting system, and event communications.", "Program Staff", "", ""], ["6", "Conduct Startup Showcase, allowing investors, partners, and guests to explore startup products and solutions. ", "Program Staff", "", ""], ["7", "Conduct Startup Pitching Sessions and Startup Award evaluation. ", "Program Staff", "", ""], ["8", "Facilitate Investor Networking, Speed Dating, and partnership discussions between startups and ecosystem stakeholders. ", "Program Staff", "", ""], ["9", "Announce Startup Awards, conduct Community Appreciation Ceremony, and conclude the event. ", "Program Staff", "", ""], ["10", "Collect post-event feedback, track investment opportunities, partnership discussions, and schedule follow-up activities. ", "Program Staff", "", "Reflection Form\n(Google Form)"], ["Add more rows as needed. Each step should be a single, clearly defined action.", "", "", "", ""]], [["Gap", "Recommendation"], ["Demo Day hiện chưa thực sự phù hợp với đặc điểm của các startup trong cohort, vì phần lớn startup vẫn ở giai đoạn early-stage. Mặc dù có VC tham gia và trao đổi với startup, tỷ lệ startup nhận được hỗ trợ/đầu tư từ VC còn thấp. Với giai đoạn này, startup có thể phù hợp hơn với angel investor, nhưng hiện mạng lưới angel investor còn hạn chế.\nNguồn angel investor còn thiếu và chưa có nhiều cơ hội để startup gặp gỡ họ thường xuyên. Với startup early-stage, angel investor cần nhiều lần tiếp xúc/pitching để duy trì interest và xây dựng niềm tin trước khi đưa ra quyết định. \nViệc tìm kiếm/crawl thông tin investor hiện còn thủ công, gây khó khăn cho việc duy trì và mở rộng mạng lưới investor phục vụ Demo Day.\nChưa có cách rõ ràng để verify chất lượng của investor ecosystem mà chương trình đang xây dựng.\nhưa có tiêu chí/cách thức rõ ràng để lựa chọn những angel investor thực sự có tâm huyết và sẵn sàng đồng hành, chia sẻ với thế hệ startup tiếp theo.", "Overall, các process steps của Demo Day hiện tương đối hoàn chỉnh, chủ yếu cần bổ sung chi tiết hơn các nội dung execution và công tác chuẩn bị trước sự kiện.\nCrawl data về các quỹ đầu tư và investor trước sự kiện ít nhất 1 tháng, trong đó có thể khai thác nguồn UEH Alumni.\nĐầu tư xây dựng database angel investor/investor, lưu các thông tin cần thiết như LinkedIn, email và các thông tin liên hệ liên quan để có thể tái sử dụng cho các sự kiện sau.\nHỏi trực tiếp startup về các quỹ đầu tư hoặc angel investor mà startup mong muốn được gặp tại Demo Day để hỗ trợ việc xác định và mời đúng đối tượng.\nBổ sung checklist chuẩn bị Demo Day chi tiết, bao gồm: startup portfolio, các tools hỗ trợ, speed dating, phiên dịch trong chương trình và các case cần lưu ý.\nChuẩn bị Level-up Program trước Demo Day ít nhất 1 tháng; liên hệ mentor trước khoảng 2 tuần. Có thể sử dụng procedure của ETP Workshop để áp dụng cho phần training của Level-up Program.\nS3 – Invitation: Gửi thư mời tới UEH Alumni và angel investor, đồng thời chuẩn bị một proposal tổng hợp các startup/dự án tham gia để investor có thể scan trước và biết rõ những dự án họ sẽ gặp/nghe pitching khi tham dự Demo Day.\nBổ sung bước send out information để đảm bảo các thông tin cần thiết được gửi đầy đủ đến investor và các bên tham gia trước sự kiện.\nChuyển Demo Day từ một sự kiện one-time thành một chuỗi hoạt động, trong đó Demo Day là sự kiện tổng kết sau các hoạt động pitching/interaction nhỏ diễn ra trước đó.\nThay vì tổ chức các mini-pitching đơn thuần, có thể tổ chức các buổi feedback + mentoring trong khoảng 2–3 tháng trước Demo Day. Mời angel investor tham gia với vai trò mentor để feedback sản phẩm và theo dõi sự phát triển của startup theo thời gian.\nCác buổi feedback + mentoring giúp investor nhìn thấy quá trình startup phát triển, thay vì chỉ gặp startup một lần tại Demo Day.\nBổ sung không gian showcase/triển lãm thường trực để startup có thể trưng bày sản phẩm và tạo thêm cơ hội cho investor, đối tác và ecosystem tiếp cận sản phẩm của startup."]], [["#", "Condition / Decision Point", "If YES → Action", "If NO → Action"], ["1", "Are investment or partnership opportunities identified during the event? ", "Schedule follow-up meetings and continue engagement. ", "Record networking outcomes and close the event. "], ["2", "Has all post-event documentation been completed?", "Archive the event and close Demo Day. ", "Complete outstanding reports and follow-up activities before closure. "]], [["Reporting Field", "Details"], ["Report Title", "Demo Day Report"], ["Reporting Frequency", "Per Event"], ["Report Prepared By", "Program Staff"], ["Submitted To", "Program Manager"], ["Submission Deadline", "DD/MM/YYYY "], ["Reporting Tool", "Google Sheets"], ["Minimum Report Contents", "Number of participating startups \nNumber of investors, judges, and partners \nAttendance statistics \nStartup Award results \nInvestment opportunities identified \nPartnership discussions \nParticipant feedback \nRecommendations for future Demo Days"], ["Distribution List", "Program Manager, Incubator Manager, Vice Director "], ["Archiving", "Google Drive → Startup Growth Management → Demo Day"]]], "newTables": [[["SOP ID", "SOP-SGM-008", "Version", "1.0"], ["Process Name", "Demo Day", "", ""], ["Effective Date", "DD/MM/YYYY", "Review Date", "DD/MM/YYYY"], ["Process Owner", "Program Manager", "", ""], ["Lifecycle Stage", "Incubation", "", ""]], [["Purpose", "To standardize the planning, preparation, execution, and post-event follow-up of Demo Day, providing startups with opportunities to showcase their achievements, pitch to investors, establish strategic partnerships, and conclude the incubation program."], ["Scope", "Applies to all Demo Day activities involving participating startups, investors, mentors, ecosystem partners, judges, and event stakeholders."], ["Trigger", "The incubation program reaches its final stage and the Program Manager approves the Demo Day event plan."], ["End Condition", "Demo Day is completed, awards are announced, post-event feedback is collected, and follow-up activities with investors and partners are initiated."]], [["#", "Step Description", "Deadline", "Responsible", "External Involvement", "Tools / Resources"], ["1", "Define Demo Day objectives, target inves  [], "new": ["13", "14"], "rawOld": [], "rawNew": [{"pos": 13, "label": "13", "fields": {"#": "13", "Step Description": "Update startup database and finalize cohort graduation records including status, pathway, impact indicators, and historical support data.", "Deadline": "Within 15 working days after cohort close", "Responsible": "SGA, \nDT Team", "External Involvement": "", "Tools / Resources": ""}}, {"pos": 14, "label": "14", "fields": {"#": "14", "Step Description": "Prepare cohort Graduation Impact Report covering startup growth, business outcomes, ecosystem contribution, employment impact, community impact, and program effectiveness.", "Deadline": "Within 20 working days after cohort close", "Responsible": "SGA, \nDT Team", "External Involvement": "", "Tools / Resources": ""}}]}, {"id": "SOP-GRA-001-meta", "title": "Document Information", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>SOP ID</th><th>SOP-GRA-001</th><th>Version</th><th>1.0</th></tr><tr><td>Process Name</td><td>Graduation</td><td></td><td></td></tr><tr><td>Effective Date</td><td>DD/MM/YYYY</td><td>Review Date</td><td>DD/MM/YYYY</td></tr><tr><td>Process Owner</td><td>Program Owner</td><td></td><td></td></tr><tr><td>Lifecycle Stage</td><td>Graduation</td><td></td><td></td></tr></table></div>"}, {"id": "SOP-GRA-001-scope", "title": "Purpose & Scope", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Purpose</th><th>To standardize the graduation evaluation process for startups completing the incubation program, ensuring a fair assessment of achievements, program outcomes, and future development pathways.</th></tr><tr><td>Scope</td><td>Applies to all startups reaching the final stage of the incubation program and undergoing graduation evaluation.</td></tr><tr><td>Trigger</td><td>A startup reaches the end of the incubation period or is approved for final evaluation by the Program Owner.</td></tr><tr><td>End Condition</td><td>The startup&#x27;s graduation status is finalized, the decision is communicated, and all program records are updated and archived.</td></tr></table></div>"}, {"id": "SOP-GRA-001-gap", "title": "Gap / Recommendation", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Gap</th><th>Recommendation</th></tr><tr><td>Chưa có cơ chế rõ ràng để duy trì engagement giữa startup alumni và các chương trình của USI sau khi kết thúc Incubation Program, đặc biệt thông qua USI Community.</td><td>Overall: Các process steps hiện tại cơ bản đã có, nhưng cần bổ sung chi tiết hơn về execution và điều chỉnh thứ tự một số bước để phản ánh đầy đủ quá trình graduation/offboarding.\nS3 → đưa lên trước S1.\nAdd-in – Offboarding Session: Bổ sung một buổi offboarding chung, mang tính informal cho toàn bộ startup trong cohort. Buổi này dùng để reflection về quá trình tham gia chương trình và collect feedback trực tiếp từ startup, làm input để cải thiện chương trình và bổ sung cho hoạt động recruitment của cohort tiếp theo.\nS2 – Đo lường tác động của Incubation Program: Xây dựng các criteria để SGA cập nhật, giúp đo lường chương trình đã tạo ra bao nhiêu giá trị cho startup, ví dụ: network mới, mentor mới, chương trình/hoạt động đã engage, giải thưởng, sự phát triển đội ngũ… Ví dụ: Onto từ 4 thành viên phát triển thành đội ngũ lớn hơn, trong đó có sinh viên UEH.\nTrong quá trình đo lường impact, cần ghi nhận kết quả thực tế của các support request, không chỉ ghi nhận việc đã hỗ trợ. Ví dụ: request đặt phòng được sử dụng cho hoạt động gì; hỗ trợ tuyển dụng mang lại kết quả như thế nào.\nS5 – SGA Reflection Meeting: Tổ chức một buổi họp giữa các SGA để tổng hợp cohort vừa kết thúc: cohort đã đạt những milestone nào, Incubation Program đã deliver những giá trị gì cho startup, đã hoàn thành bao nhiêu request, mentoring session và các hoạt động hỗ trợ khác.\nTrong SGA Reflection Meeting, đồng thời review startup đã có những tiến triển gì, mức độ mature, thành tích đạt được, và tổng hợp lessons learned cho cohort tiếp theo.\nCó thể crawl data và xây dựng dashboard trực quan để hỗ trợ việc tổng hợp và theo dõi các kết quả trên.\nAdd-in giữa S5 và S6 – Startup Post-Program Decision: Bổ sung bước để SGA xác định hướng xử lý tiếp theo cho từng startup trong cohort: offboarding, tiếp tục sử dụng dịch vụ, hoặc PIS.\nCó một buổi meeting giữa các SGA để thống nhất từng startup sau cohort sẽ được xử lý như thế nào. Nếu startup tiếp tục sử dụng dịch vụ thì áp dụng các process đã có phía trên như gặp SGA, Mentoring, Shared Services...\nS6 – Propose Next Step for Each Startup: Sau khi kết thúc Incubation Program, SGA và startup cùng xây dựng OKRs cho 6 tháng tiếp theo, giúp visualize rõ startup cần làm gì và hướng phát triển trong giai đoạn tiếp theo.\nS7 – Impact Report: Báo cáo không chỉ phản ánh kết quả của cohort mà cần thể hiện tác động của Incubation Program đối với xã hội, ví dụ: job creation, tuyển dụng sinh viên, giá trị/doanh thu tạo ra, đóng góp cho cộng đồng và số lượng dự án được hỗ trợ.</td></tr></table></div>"}, {"id": "SOP-GRA-001-decisions", "title": "Decision Points & Exceptions", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>#</th><th>Condition / Decision Point</th><th>If YES → Action</th><th>If NO → Action</th></tr><tr><td>1</td><td>Has the startup met the graduation criteria?</td><td>Proceed with graduation evaluation.</td><td>Request additional information or complete the remaining evaluation requirements.</td></tr><tr><td>2</td><td>Has the Program Owner approved the final recommendation?</td><td>Notify the startup and complete the graduation process.</td><td>Return the evaluation for further review.</td></tr></table></div>"}, {"id": "SOP-GRA-001-report", "title": "Reporting", "kind": "Giữ nguyên nội dung", "tags": ["same"], "flag": false, "summary": "Giữ nguyên nội dung sau khi bỏ qua khoảng trắng và nối bảng bị ngắt.", "body": "<div class=\"table-scroll\"><table><tr><th>Reporting Field</th><th>Details</th></tr><tr><td>Report Title</td><td>Graduation Evaluation Report</td></tr><tr><td>Reporting Frequency</td><td>Per Cohort</td></tr><tr><td>Report Prepared By</td><td>Startup Growth Associate</td></tr><tr><td>Submitted To</td><td>Program Owner</td></tr><tr><td>Submission Deadline</td><td>DD/MM/YYYY</td></tr><tr><td>Reporting Tool</td><td>Google Sheets, Evaluation Report</td></tr><tr><td>Minimum Report Contents</td><td>Number of graduating startups\nGraduation decisions (Graduate, Extension, Transition)\nAchievement of OKRs and KPIs\nBusiness outcomes and milestones\nInvestment and partnership results\nLessons learned\nRecommendations for future cohorts</td></tr><tr><td>Distribution List</td><td>Program Owner, Incubator Manager, Vice Director</td></tr><tr><td>Archiving</td><td>Google Drive → Graduation</td></tr></table></div>"}, {"id": "SOP-GRA-001-inline-decisions", "title": "Dòng quyết định trong Process Steps", "kind": "Bổ sung dòng quyết định", "tags": ["structure", "content"], "flag": false, "summary": "1 dòng quyết định chèn trong quy trình mới, không tính là bước đánh số. Mục Decision Points & Exceptions riêng vẫn được đối chiếu bên trên.", "body": "<div class=\"added-text\">DECISION POINT: Does the startup meet graduation criteria and provide sufficient evidence? YES → Proceed to graduation recommendation. NO → Request additional evidence, improvement actions, or remediation plan.</div>"}], "alerts": [{"title": "Mốc và bên tham gia bất thường", "text": "Bước 3 ghi Deadline “5 weeks before deli
